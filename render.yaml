services:
  - type: web
    name: shetirakshak-backend
    runtime: node
    plan: starter
    region: singapore
    buildCommand: cd backend && npm install --production
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://shetirakshak.vercel.app
      - key: WEATHER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
